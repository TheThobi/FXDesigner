name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # SwiftShader e2e, split in four parts of similar length (tests tagged @part1…@part4) run on
  # parallel machines.
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright test --grep @part${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-screenshots-${{ matrix.part }}
          path: test-results/
